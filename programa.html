// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function CharacterImage({ src, alt, size = 80, animate = false, fallback }) {
  const [loaded, setLoaded] = React.useState(false);
  const [error, setError] = React.useState(false);
  return error || !src
    ? (fallback || null)
    : <img src={src} alt={alt} width={size} height={size}
        style={{objectFit:'contain', objectPosition:'bottom center', display:'block',
          filter:'drop-shadow(0 8px 20px rgba(0,0,0,0.15))',
          animation: animate ? 'float 4s ease-in-out infinite' : 'none',
          opacity: loaded ? 1 : 0, transition: 'opacity 0.3s',
        }}
        onLoad={() => setLoaded(true)}
        onError={() => setError(true)}
      />;
}

// ─── Stars ────────────────────────────────────────────────────────────────────

function Stars({ count = 0, max = 3, size = 20 }) {
  return (
    <div style={{display:'flex', gap: 4}}>
      {Array.from({length: max}).map((_, i) => (
        <svg key={i} width={size} height={size} viewBox="0 0 20 20">
          <polygon
            points="10,2 12.4,7.5 18.5,8 14,12.2 15.5,18.2 10,15 4.5,18.2 6,12.2 1.5,8 7.6,7.5"
            fill={i < count ? '#F5BC00' : '#E0D5C0'}
            stroke={i < count ? '#E8A200' : '#C8BA9A'}
            strokeWidth="0.5"
          />
        </svg>
      ))}
    </div>
  );
}

// ─── Progress Bar ─────────────────────────────────────────────────────────────

function ProgressBar({ value = 0, max = 100, color = '#22C5A8', label }) {
  const pct = Math.min(100, Math.round((value / max) * 100));
  return (
    <div>
      {label && <div style={{fontSize:12, fontFamily:'Nunito', fontWeight:700, color:'#7A6A55', marginBottom:4}}>{label}</div>}
      <div style={{background:'#E0D5C0', borderRadius:100, height:10, overflow:'hidden'}}>
        <div style={{
          width: pct + '%', height: '100%', background: color,
          borderRadius: 100, transition: 'width 1s ease',
        }}/>
      </div>
    </div>
  );
}

  const pad = size === 'lg' ? '15px 40px' : size === 'sm' ? '8px 18px' : '12px 28px';

function PinInput({ value, onChange }) {
  return (
    <div style={{display:'flex', gap:10, justifyContent:'center'}}>
      {[0,1,2,3].map(i => (
        <input key={i} type="tel" inputMode="numeric" maxLength={1}
          value={value[i] || ''}
          onChange={e => {
            const v = e.target.value.replace(/\D/,'');
            const arr = value.split('');
            arr[i] = v;
            onChange(arr.join(''));
            if (v && i < 3) document.getElementById('pin-' + (i+1))?.focus();
          }}
          onKeyDown={e => { if (e.key==='Backspace' && !value[i] && i>0) document.getElementById('pin-'+(i-1))?.focus(); }}
          id={'pin-'+i}
          style={{
            width:56, height:64, textAlign:'center', fontSize:28,
            fontFamily:'Montserrat', fontWeight:800,
            borderRadius:14, border:`2.5px solid ${value[i] ? DS.green : 'rgba(27,47,107,0.18)'}`,

            boxShadow: value[i] ? '0 0 0 3px rgba(22,197,83,0.12)' : 'none',

    </div>
  );
}

function LoginScreen({ onLogin, onBack, tweaks, loginError = '' }) {
  const [mode, setMode] = React.useState('login');
  const [user, setUser] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [pin, setPin] = React.useState('');
  const [newPass, setNewPass] = React.useState('');
  const [error, setError] = React.useState('');
  const [success, setSuccess] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [pendingUser, setPendingUser] = React.useState('');
  const [show, setShow] = React.useState(false);
  React.useEffect(() => { setTimeout(() => setShow(true), 80); }, []);
  React.useEffect(() => { if (loginError) { setError(loginError); setLoading(false); } }, [loginError]);

  async function handleLogin(e) {
    e.preventDefault();
    if (!user || !pass) { setError('Por favor ingresa tus datos.'); return; }
    setLoading(true); setError('');
    const result = await onLogin(user, pass);
    if (result && result.isNew) { setPendingUser(user); setLoading(false); setMode('setup-pin'); }
  }

  async function handleSetupPin(e) {
    e.preventDefault();
    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) { setError('El PIN debe ser exactamente 4 dígitos.'); return; }
    setLoading(true); setError('');
    await onLogin(pendingUser, pass, pin);
  }

  async function handleForgot(e) {
    e.preventDefault();
    if (!user) { setError('Ingresa tu nombre de usuario.'); return; }
    if (pin.length !== 4) { setError('Ingresa tu PIN de 4 dígitos.'); return; }
    setLoading(true); setError('');
    try {
      const hash = await hashPin(pin);
      const doc = await db.collection('usuarios').doc(user).get();
      if (!doc.exists) { setError('Usuario no encontrado.'); setLoading(false); return; }
      if (doc.data().pinHash !== hash) { setError('PIN incorrecto.'); setLoading(false); return; }
      setPendingUser(user); setLoading(false); setMode('reset');
    } catch(e) { setError('Error de conexión.'); setLoading(false); }
  }

  async function handleReset(e) {
    e.preventDefault();
    if (!newPass || newPass.length < 3) { setError('Mínimo 3 caracteres.'); return; }
    setLoading(true); setError('');
    try {
      const hash = await hashPassword(newPass);
      await db.collection('usuarios').doc(pendingUser).update({ passwordHash: hash });
      setSuccess('¡Contraseña cambiada! Ya puedes iniciar sesión.');
      setLoading(false);
      setTimeout(() => { setMode('login'); setSuccess(''); setUser(pendingUser); setPass(''); }, 2000);
    } catch(e) { setError('Error al guardar.'); setLoading(false); }
  }

  const pageStyle = {
    minHeight:'100vh', background:'linear-gradient(140deg, #0A1435 0%, #1B2F6B 45%, #0E5C28 100%)',
    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:24, position:'relative',
  };
  const cardStyle = {
    background:'white', borderRadius:28, padding:'clamp(24px,5vw,40px)',
    boxShadow:'0 24px 64px rgba(10,20,53,0.35)', width:'100%', maxWidth:420,
    opacity:show?1:0, transform:show?'translateY(0) scale(1)':'translateY(24px) scale(0.97)',
    transition:'all 0.5s cubic-bezier(0.34,1.56,0.64,1)',
  };

  const [imgOk, setImgOk] = React.useState(true);

  return (
    <div style={pageStyle}>
      {/* Back button */}
      <button onClick={() => mode==='login' ? onBack() : setMode('login')} style={{
        position:'absolute', top:20, left:20, background:'rgba(255,255,255,0.1)',
        border:'1.5px solid rgba(255,255,255,0.2)', borderRadius:100,
        cursor:'pointer', fontFamily:'Nunito', fontSize:13, fontWeight:700,
        color:'rgba(255,255,255,0.85)', display:'flex', alignItems:'center', gap:5, padding:'7px 14px',
        transition:'background 0.2s',
      }}>← {mode==='login' ? 'Volver' : 'Iniciar sesión'}</button>

      <div style={cardStyle}>

        {/* ── LOGIN ── */}
        {mode === 'login' && (
          <>
            {/* Header */}
            <div style={{display:'flex', alignItems:'center', gap:14, marginBottom:20, paddingBottom:18, borderBottom:'2px solid rgba(27,47,107,0.06)'}}>
              <div style={{width:52, height:52, borderRadius:14, background:DS.greenBg, border:`2px solid ${DS.green}30`, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', flexShrink:0}}>
                {imgOk
                  ? <img src="https://lh3.googleusercontent.com/d/1OAiwip7c7vQ5KhDcP_hTDUPotYEe-LYM" alt="Coco" style={{width:'100%', height:'100%', objectFit:'contain'}} onError={() => setImgOk(false)}/>
                  : <span style={{fontSize:28}}>🦜</span>
                }
              </div>
              <div>
                <h2 style={{fontFamily:'Montserrat', fontWeight:900, fontSize:22, color:DS.blue, margin:0, letterSpacing:'-0.5px'}}>¡Bienvenido/a!</h2>
                <p style={{fontFamily:'Nunito', fontSize:13, color:DS.textM, margin:0, fontWeight:600}}>Ingresa tus datos para acceder</p>
              </div>
            </div>

            {/* Mission notice */}
            <div style={{background:DS.greenBg, border:`1.5px solid ${DS.green}35`, borderRadius:12, padding:'10px 14px', marginBottom:20, display:'flex', alignItems:'center', gap:8}}>
              <span style={{fontSize:16}}>🗺️</span>
              <span style={{fontFamily:'Nunito', fontSize:13, color:DS.greenD, fontWeight:700}}>Tu misión de esta semana ya está lista</span>
            </div>

        {/* ── FORGOT ── */}
        {mode === 'forgot' && (
          <>
            <div style={{textAlign:'center', marginBottom:24}}>
              <div style={{width:64, height:64, borderRadius:20, background:'#EFF6FF', border:'2px solid rgba(65,105,212,0.25)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 12px', fontSize:32}}>🦜</div>

                {loading ? 'Verificando...' : 'Verificar PIN →'}

            </form>

        {mode === 'reset' && (
          <>
            <div style={{textAlign:'center', marginBottom:24}}>
              <div style={{width:64, height:64, borderRadius:20, background:DS.greenBg, border:`2px solid ${DS.green}30`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 12px', fontSize:32}}>🔑</div>

                <form onSubmit={handleReset} style={{display:'flex', flexDirection:'column', gap:14}}>

                  <PrimaryBtn size="md" style={{width:'100%'}} onClick={handleReset} disabled={loading}>
                    {loading ? 'Guardando...' : '¡Cambiar contraseña! →'}
                  </PrimaryBtn>
                </form>
              )
            }
          </>
        )}
      </div>
    </div>
  );
}

function ActivityScreen({ username, ageGroup, onFinish, onStepComplete, tweaks }) {
  const isJunior = ageGroup === 'junior';
  const activities = isJunior ? ACTIVITIES_J : ACTIVITIES_E;
  const [step, setStep] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [feedback, setFeedback] = React.useState(null);
  const [show, setShow] = React.useState(true);
  const act = activities[step];
  const [charImgOk, setCharImgOk] = React.useState(true);

  function choose(i) {
    if (feedback) return;
    setSelected(i);
    setFeedback(i===act.correct ? 'correct' : 'wrong');
  }

  function next() {
    if (step < activities.length-1) {
      if (onStepComplete) onStepComplete(step+2);
      setShow(false);
      setTimeout(() => { setStep(s=>s+1); setSelected(null); setFeedback(null); setShow(true); }, 350);
    } else { onFinish(); }
  }

  return (
    <div style={{minHeight:'100vh', background:DS.cream, padding:'22px 18px 36px', boxSizing:'border-box'}}>
      <div style={{maxWidth:520, margin:'0 auto'}}>

        {/* Phase progress */}
        <div style={{marginBottom:16}}>
          <div style={{display:'flex', gap:5, marginBottom:6}}>
            {activities.map((_,i) => (
              <div key={i} style={{flex:1, height:5, borderRadius:3, background:i<=step?DS.green:'rgba(27,47,107,0.1)', transition:'background 0.3s'}}/>
            ))}
          </div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span style={{fontFamily:'Montserrat', fontSize:11, fontWeight:800, color:DS.textM, textTransform:'uppercase', letterSpacing:1}}>{act.phase}</span>
            <span style={{fontFamily:'Montserrat', fontSize:11, fontWeight:800, color:DS.green}}>{step+1}/{activities.length}</span>
          </div>
        </div>

        {/* Coco instruction */}
        <div style={{display:'flex', gap:10, alignItems:'flex-start', marginBottom:16, opacity:show?1:0, transform:show?'none':'translateY(12px)', transition:'all 0.35s ease'}}>
          <div style={{width:52, height:64, borderRadius:14, background:DS.greenBg, border:`2px solid ${DS.green}30`, overflow:'hidden', flexShrink:0, display:'flex', alignItems:'flex-end', justifyContent:'center'}}>
            {charImgOk
              ? <img src="https://lh3.googleusercontent.com/d/1OAiwip7c7vQ5KhDcP_hTDUPotYEe-LYM" alt="Coco" style={{width:'100%', objectFit:'contain', objectPosition:'bottom center'}} onError={() => setCharImgOk(false)}/>
              : <span style={{fontSize:28, paddingBottom:4}}>🦜</span>
            }
          </div>
          <SpeechBubbleNew text={act.instruction} char="coco" style={{fontSize: isJunior?16:14, flex:1}}/>
        </div>

        {/* Visual */}
        <div style={{textAlign:'center', marginBottom:16, opacity:show?1:0, transition:'opacity 0.35s ease 0.08s'}}>
          <div style={{display:'inline-block', background:'white', borderRadius:20, padding:'16px 24px', boxShadow:DS.shadowL, border:'2px solid rgba(27,47,107,0.06)'}}>
            <div style={{fontSize:isJunior?72:60, lineHeight:1}}>{act.image}</div>
            <div style={{fontFamily:'Nunito', fontSize:11, color:DS.textL, fontWeight:700, marginTop:6}}>[{act.imageLabel}]</div>
          </div>
        </div>

        {/* Options */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:16, opacity:show?1:0, transition:'opacity 0.35s ease 0.12s'}}>
          {act.options.map((opt,i) => {
            let bg='white', border='rgba(27,47,107,0.12)', color=DS.blue, boxShadow=DS.shadowL;
            if (feedback && i===act.correct) { bg=DS.greenBg; border=DS.green; color=DS.greenD; boxShadow=`0 4px 16px ${DS.green}30`; }
            if (feedback==='wrong' && i===selected) { bg='rgba(239,68,68,0.06)'; border='#EF4444'; color='#EF4444'; }
            return (
              <button key={i} onClick={() => choose(i)} style={{
                background:bg, border:`2.5px solid ${border}`,
                borderRadius:14, padding:isJunior?'16px 12px':'13px 12px',
                fontFamily:'Montserrat', fontSize:isJunior?16:14, fontWeight:700, color,
                cursor:feedback?'default':'pointer', transition:'all 0.2s',
                transform:(feedback&&i===act.correct)?'scale(1.04)':'scale(1)',
                boxShadow,
              }}>{opt}</button>
            );
          })}
        </div>

        {/* Feedback */}
        {feedback && (
          <div style={{
            background: feedback==='correct' ? DS.greenBg : 'rgba(251,191,36,0.12)',
            border:`2px solid ${feedback==='correct' ? DS.green : '#FBBF24'}`,
            borderRadius:16, padding:16, marginBottom:16,
            display:'flex', gap:10, alignItems:'flex-start',
            animation:'fadeSlideUp 0.3s ease',
          }}>
            <div style={{fontSize:22, flexShrink:0}}>{feedback==='correct' ? '🎉' : '🦜'}</div>
            <div>
              <div style={{fontFamily:'Montserrat', fontSize:13, fontWeight:800, color:feedback==='correct'?DS.greenD:'#D97706', marginBottom:3}}>
                {feedback==='correct' ? '¡Muy bien!' : 'Casi lo logramos...'}
              </div>
              <div style={{fontFamily:'Nunito', fontSize:13, color:DS.textM, lineHeight:1.55}}>{act.explanation}</div>
            </div>
          </div>
        )}

        {feedback && (
          <PrimaryBtn size="lg" style={{width:'100%'}} onClick={next}>
            {step < activities.length-1 ? 'Siguiente →' : '¡Misión completada! 🌟'}
          </PrimaryBtn>
        )}
      </div>
    </div>
  );
}

  storageBucket: "espanol-herencia.firebasestorage.app",
  messagingSenderId: "106510189513",
  appId: "1:106510189513:web:e3f2f7a74a40298ae55e18"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function hashPassword(password) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password + 'eh-salt-2024'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin + 'eh-pin-2024'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loginUser(username, password, pin) {
  const hash = await hashPassword(password);
  try {
    const doc = await db.collection('usuarios').doc(username).get();
    if (!doc.exists) {
      await db.collection('usuarios').doc(username).set({ username, passwordHash: hash, createdAt: new Date().toISOString(), points: 0, missionsCompleted: [] });
      if (pin) { const pinHash = await hashPin(pin); await db.collection('usuarios').doc(username).update({ pinHash }); }
      return { status: 'new', data: null };
    }
    const data = doc.data();
    if (pin) { const pinHash = await hashPin(pin); await db.collection('usuarios').doc(username).update({ pinHash }); return { status: 'pin-saved', data }; }
    if (data.passwordHash !== hash) return { status: 'wrong_password', data: null };
    return { status: 'ok', data };
  } catch(e) {
    console.warn('Firebase error:', e);
    const cached = JSON.parse(localStorage.getItem('eh_' + username) || 'null');
    if (!cached) return { status: 'new', data: null };
    if (cached.passwordHash === hash) return { status: 'ok', data: cached };
    return { status: 'wrong_password', data: null };
  }
}

async function saveUserData(username, data) {
  try { const e = JSON.parse(localStorage.getItem('eh_' + username)||'{}'); localStorage.setItem('eh_' + username, JSON.stringify({...e,...data})); } catch(e) {}
  try { await db.collection('usuarios').doc(username).set(data, { merge: true }); } catch(e) { console.warn('Save error:', e); }
}

const DEFAULT_PROGRESS = { points: 0, stars: 0, mission1Activity: 0, mission1Stars: 0, missionsCompleted: [] };

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState('landing');
  const [username, setUsername] = React.useState('');
  const [nickname, setNickname] = React.useState('');
  const [avatarId, setAvatarId] = React.useState(null);
  const [ageGroup, setAgeGroup] = React.useState(null);
  const [progress, setProgress] = React.useState(DEFAULT_PROGRESS);
  const [syncStatus, setSyncStatus] = React.useState('idle');
  const [loginError, setLoginError] = React.useState('');

  async function handleLogin(u, p, pin) {
    setLoginError('');
    const result = await loginUser(u, p, pin);
    if (result.status === 'wrong_password') { setLoginError('Contraseña incorrecta. Inténtalo de nuevo.'); return { isNew: false }; }
    setUsername(u);
    if (result.status === 'new') return { isNew: true };
    if (result.status === 'pin-saved') { setScreen('avatar'); return { isNew: false }; }
    const d = result.data || {};
    if (d.nickname) setNickname(d.nickname);
    if (d.avatarId) setAvatarId(d.avatarId);
    if (d.ageGroup) setAgeGroup(d.ageGroup);
    setProgress({ points: d.points||0, stars: d.stars||0, mission1Activity: d.mission1Activity||0, mission1Stars: d.mission1Stars||0, missionsCompleted: d.missionsCompleted||[] });
    setScreen(d.avatarId && d.ageGroup ? 'dashboard' : 'avatar');
    return { isNew: false };
  }

  async function handleAvatar(id, nick) { setAvatarId(id); setNickname(nick); setScreen('age'); }

  async function handleAge(ag) {
    setAgeGroup(ag); setSyncStatus('saving');
    await saveUserData(username, { nickname, avatarId, ageGroup: ag, updatedAt: new Date().toISOString() });
    setSyncStatus('saved'); setTimeout(() => setSyncStatus('idle'), 2500);
    setScreen('dashboard');
  }

  async function handleActivityStep(stepNum) {
    const newProgress = { ...progress, mission1Activity: stepNum };
    setProgress(newProgress);
    await saveUserData(username, { mission1Activity: stepNum, lastActive: new Date().toISOString() });
  }

  async function handleMissionComplete() {
    const isJunior = ageGroup === 'junior';
    const totalSteps = isJunior ? 3 : 5;
    const newPoints = (progress.points||0) + 30;
    const newStars = Math.min(3, (progress.stars||0) + 1);
    const newProgress = { ...progress, points: newPoints, stars: newStars, mission1Activity: totalSteps, mission1Stars: 3, missionsCompleted: [...(progress.missionsCompleted||[]), 1] };
    setProgress(newProgress);
    setSyncStatus('saving');
    await saveUserData(username, { points: newPoints, stars: newStars, mission1Activity: totalSteps, mission1Stars: 3, missionsCompleted: newProgress.missionsCompleted, lastActive: new Date().toISOString() });
    setSyncStatus('saved'); setTimeout(() => setSyncStatus('idle'), 2500);
    setScreen('complete');
  }

  const nav = setScreen;
  const displayName = nickname || username;

  return (
    <div style={{minHeight:'100vh', position:'relative'}}>
      {screen === 'landing'   && <LandingScreen     tweaks={tweaks} onEnter={() => nav('login')}/>}
      {screen === 'login'     && <LoginScreen        tweaks={tweaks} onLogin={handleLogin} onBack={() => nav('landing')} loginError={loginError}/>}
      {screen === 'avatar'    && <AvatarScreen       tweaks={tweaks} username={username} onContinue={handleAvatar}/>}
      {screen === 'age'       && <AgeScreen          tweaks={tweaks} username={displayName} avatarId={avatarId} onContinue={handleAge}/>}
      {screen === 'dashboard' && <DashboardScreen    tweaks={tweaks} username={displayName} avatarId={avatarId} ageGroup={ageGroup} progress={progress} onMission={() => nav('mission')}/>}
      {screen === 'mission'   && <MissionIntroScreen tweaks={tweaks} username={displayName} ageGroup={ageGroup} onStart={() => nav('activity')} onBack={() => nav('dashboard')}/>}
      {screen === 'activity'  && <ActivityScreen     tweaks={tweaks} username={displayName} ageGroup={ageGroup} onStepComplete={handleActivityStep} onFinish={handleMissionComplete}/>}
      {screen === 'complete'  && <CompleteScreen     tweaks={tweaks} username={displayName} ageGroup={ageGroup} progress={progress} onHome={() => nav('dashboard')}/>}

      {syncStatus !== 'idle' && (
        <div style={{position:'fixed', bottom:20, left:'50%', transform:'translateX(-50%)', background: syncStatus==='saved'?'#22C5A8':'#8A9A90', color:'white', fontFamily:'Nunito', fontSize:13, fontWeight:700, padding:'8px 20px', borderRadius:100, boxShadow:'0 4px 16px rgba(0,0,0,0.2)', zIndex:9999, display:'flex', alignItems:'center', gap:8, whiteSpace:'nowrap'}}>
          {syncStatus === 'saving' && '☁️ Guardando progreso...'}
          {syncStatus === 'saved'  && '✅ Progreso guardado en la nube'}
        </div>
      )}

      <TweaksPanel>
        <TweakSection title="Colores">
          <TweakColor id="primaryColor" label="Color principal" value={tweaks.primaryColor} onChange={v => setTweak('primaryColor', v)}/>
          <TweakColor id="bgFrom" label="Fondo inicio" value={tweaks.bgFrom} onChange={v => setTweak('bgFrom', v)}/>
          <TweakColor id="bgTo" label="Fondo final" value={tweaks.bgTo} onChange={v => setTweak('bgTo', v)}/>
        </TweakSection>
        <TweakSection title="Apariencia">
          <TweakToggle id="darkMode" label="Modo oscuro" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)}/>
        </TweakSection>
        <TweakSection title="Contenido">
          <TweakText id="tagline" label="Subtítulo de portada" value={tweaks.tagline} onChange={v => setTweak('tagline', v)}/>
        </TweakSection>
        <TweakSection title="Ir a pantalla">
          <div style={{display:'flex', flexDirection:'column', gap:5}}>
            {['landing','login','avatar','age','dashboard','mission','activity','complete'].map(s => (
              <button key={s} onClick={() => nav(s)} style={{background: screen===s?'#22C5A8':'#f0f0f0', color: screen===s?'white':'#333', border:'none', borderRadius:7, padding:'5px 10px', fontFamily:'Nunito', fontSize:12, fontWeight:700, cursor:'pointer', textAlign:'left', transition:'all 0.2s'}}>{s}</button>
            ))}
          </div>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
</body>
</html>
